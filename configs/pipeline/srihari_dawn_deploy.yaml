dataset:
  name: cifar10
  variant: clean

model:
  script: configs/model/config_model_resnet20.py
  framework: pytorch

pipeline:
  pre_training:
    noop:
      name: pre_noop
      container:
        image: docker://ghcr.io/landseer-project/pre_noop:v1
        command: "python main.py"

  during_training:
    noop:
      name: in_noop
      container:
        image: docker://ghcr.io/landseer-project/in_noop:v5
        command: "python main.py"

  post_training:
    noop:
      name: post_noop
      container:
        image: docker://ghcr.io/landseer-project/post_noop_new:v1
        command: "python main.py"

  deployment:
    tools:
      - name: deploy_dawn_deploy
        container:
          image: oras://ghcr.io/srihari87/deploy_dawn:v2
          command: "python main.py"
    noop:
      name: deploy_noop
      container:
        image: docker://ghcr.io/landseer-project/deploy_noop_docker:v1
        command: "python main.py"
